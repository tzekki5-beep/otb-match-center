/* V18: clear halfway line */
.pitch::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:50%;
  height:2px;
  background:rgba(255,255,255,.58);
  box-shadow:0 0 1px rgba(255,255,255,.25);
  z-index:1;
  pointer-events:none;
}
.pitch::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:72px;
  height:72px;
  transform:translate(-50%,-50%);
  border:2px solid rgba(255,255,255,.58);
  border-radius:50%;
  z-index:1;
  pointer-events:none;
}
